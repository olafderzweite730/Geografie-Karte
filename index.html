<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geografie-Lernkarte</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, #1e3a5f, #2c5f8a);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 24px; padding: 20px;
  }
  h1 { color: white; font-size: 1.6rem; text-align: center; }
  p { color: #bcd3ea; text-align: center; max-width: 480px; font-size: .9rem; }
  .cards { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  a.card {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    background: white; border-radius: 16px; padding: 28px 36px;
    text-decoration: none; color: #1e3a5f; font-weight: 700; font-size: 1.1rem;
    box-shadow: 0 8px 24px rgba(0,0,0,.25); transition: transform .15s, box-shadow .15s;
  }
  a.card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,.35); }
  a.card .emoji { font-size: 2.6rem; }
  a.card .small { font-size: .75rem; color: #888; font-weight: 400; }
</style>
</head>
<body>
  <h1>🌍 Geografie-Lernkarte</h1>
  <p>Mit Quiz, Zeichnen-Modus, Suche und Lern-Statistik:</p>
  <div class="cards">
    <a class="card" href="asien.html">
      <span class="emoji">🌏</span>
      Asien &amp; Australien
      <span class="small">107 Begriffe: Länder, Städte, Flüsse, Gebirge u.v.m.</span>
    </a>
  </div>
</body>
</html>
