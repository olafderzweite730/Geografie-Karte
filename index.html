<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geografie-Lernkarte: Nordamerika (58 Begriffe)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f0f4f8; display: flex; flex-direction: column; height: 100vh; }

  header {
    background: #1e3a5f; color: white; padding: 10px 16px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    box-shadow: 0 2px 6px rgba(0,0,0,.2); z-index: 1200;
  }
  header h1 { font-size: 1.05rem; margin-right: auto; }

  #search-wrap { position: relative; display: inline-block; }
  #search-box {
    border: none; border-radius: 6px; padding: 7px 12px; font-size: .8rem;
    width: 160px; outline: none;
  }
  #search-results {
    display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 1300;
    background: white; border-radius: 8px; min-width: 230px; max-height: 300px; overflow-y: auto;
    box-shadow: 0 6px 18px rgba(0,0,0,.3);
  }
  #search-results .item {
    padding: 8px 12px; font-size: .82rem; cursor: pointer; display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid #eee; color: #222;
  }
  #search-results .item:hover { background: #e3f2fd; }
  #search-results .cat {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none;
  }
  #search-results .small { color: #888; font-size: .72rem; margin-left: auto; }

  .btn {
    border: none; border-radius: 6px; padding: 7px 12px; cursor: pointer;
    font-size: .8rem; font-weight: 600; background: #ffffff22; color: white;
    transition: background .15s;
  }
  .btn:hover { background: #ffffff3d; }
  .btn.active { background: #4a9dec; }

  #map { flex: 1; z-index: 1; position: relative; }

  #quiz-banner {
    display: none; position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    z-index: 1100; background: #1e3a5f; color: white; padding: 12px 20px; border-radius: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,.35); text-align: center; max-width: 90%;
  }
  #quiz-banner .question { font-size: 1.05rem; font-weight: 700; }
  #quiz-banner .result { margin-top: 6px; font-size: .95rem; min-height: 1.3em; }
  #quiz-banner .result.good { color: #7dff9a; }
  #quiz-banner .result.ok { color: #ffd97d; }
  #quiz-banner .result.bad { color: #ff8a8a; }
  #quiz-banner .score { margin-top: 4px; font-size: .8rem; color: #bcd3ea; }

  #score-panel {
    display: none; position: absolute; bottom: 20px; right: 20px; z-index: 1100;
    background: white; border-radius: 10px; padding: 12px 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,.25); font-size: .85rem;
  }
  #score-panel h3 { font-size: .95rem; margin-bottom: 6px; color: #1e3a5f; }


  .legend {
    background: white; border-radius: 8px; padding: 8px 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.2); font-size: .78rem; line-height: 1.7;
  }
  .legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }

  .popup-title { font-size: 1rem; font-weight: 700; color: #1e3a5f; margin-bottom: 3px; }
  .popup-info { font-size: .82rem; color: #444; }

  .leaflet-tooltip.term-label {
    background: transparent; border: none; box-shadow: none;
    font-size: .72rem; font-weight: 700; color: #333; white-space: nowrap;
    text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
    padding: 0;
  }
  .leaflet-tooltip.term-label::before { display: none; }

  @keyframes blinkArea { 0%,100% { opacity: .9; } 50% { opacity: .1; } }
  .blink { animation: blinkArea 1.1s infinite; }
  #map.drawing { cursor: crosshair; }
</style>
</head>
<body>

<header>
  <h1>🌍 Geografie-Lernkarte Nordamerika</h1>
  <div>
    <button class="btn active" id="btn-A" onclick="toggleLayer('A')">A Großräume</button>
    <button class="btn active" id="btn-B" onclick="toggleLayer('B')">B Gewässer</button>
    <button class="btn active" id="btn-C" onclick="toggleLayer('C')">C Meere</button>
    <button class="btn active" id="btn-D" onclick="toggleLayer('D')">D Gebirge</button>
    <button class="btn active" id="btn-E" onclick="toggleLayer('E')">E Städte</button>
    <button class="btn" id="btn-labels" onclick="toggleLabels()">🏷️ Namen</button>
    <div id="search-wrap">
      <input type="text" id="search-box" placeholder="🔍 Suchen..." oninput="doSearch(this.value)" onkeydown="if(event.key==='Enter')searchSelect(0)" autocomplete="off">
      <div id="search-results"></div>
    </div>
  </div>
  <button class="btn" id="btn-quiz" onclick="toggleQuiz()">🎯 Quiz</button>
  <button class="btn" id="btn-draw" onclick="toggleDraw()">✏️ Zeichnen</button>
</header>

<div id="map">
  <div id="quiz-banner">
    <div class="question" id="quiz-question"></div>
    <div class="result" id="quiz-result"></div>
    <div class="score" id="quiz-score"></div>
  </div>
  <div id="score-panel">
    <h3>📊 Quiz-Ergebnis</h3>
    <div>Richtig (✓): <b id="sc-good">0</b></div>
    <div>Knapp: <b id="sc-ok">0</b></div>
    <div>Daneben: <b id="sc-bad">0</b></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ================= A) GRÖSSRÄUME =================
const GROSSRAEUME = [
  { name:"Great Plains", koord:[42.0,-100.0], poly:[[49.0,-104.0],[49.0,-100.0],[42.0,-97.0],[36.0,-99.5],[33.5,-101.5],[36.5,-105.5],[43.0,-106.0],[49.0,-106.0]] },
  { name:"Labrador", koord:[54.5,-61.5], poly:[[60.0,-67.0],[58.0,-63.5],[54.5,-58.5],[52.0,-57.5],[51.5,-62.0],[53.5,-67.5],[57.5,-70.0],[60.5,-69.0]] },
  { name:"Grosses Becken", koord:[40.0,-117.0], poly:[[42.0,-121.0],[41.5,-117.0],[39.0,-114.5],[37.0,-115.0],[36.5,-118.0],[39.5,-120.5],[41.5,-120.5]] },
  { name:"Colorado-Plateau", koord:[37.0,-110.5], poly:[[40.0,-111.5],[38.5,-108.0],[36.0,-108.5],[35.0,-111.5],[37.5,-114.5],[39.5,-112.5]] },
  { name:"Florida", koord:[27.9,-81.5], poly:[[30.8,-84.5],[29.0,-82.5],[27.0,-80.5],[25.2,-80.6],[25.0,-82.0],[27.0,-83.0],[29.5,-85.0],[31.0,-85.0]] },
  { name:"Kalifornien", koord:[36.5,-119.5], poly:[[42.0,-124.0],[40.0,-124.0],[36.0,-121.8],[34.0,-120.5],[32.5,-117.2],[35.0,-114.5],[37.5,-119.0],[40.0,-121.5]] },
  { name:"Death Valley", koord:[36.5,-117.1], info:"Hitzepol: 56,7 °C – heißester Ort der Erde" },
  { name:"Everglades", koord:[25.9,-80.9], info:"Tropisches Feuchtgebiet im Süden Floridas" },
  { name:"Aleuten-Bogen", koord:[53.0,-168.0], poly:[[55.5,-163.5],[53.0,-168.5],[52.0,-174.0],[51.5,-179.0],[53.5,-179.5],[55.0,-171.0],[56.5,-165.0]] },
  { name:"Baffin-Insel", koord:[68.0,-72.0], poly:[[71.5,-78.0],[70.5,-70.0],[67.0,-62.0],[64.5,-66.5],[65.5,-74.5],[68.0,-80.0]] },
  { name:"Neufundland", koord:[48.7,-56.0], poly:[[51.5,-58.0],[49.5,-53.5],[46.9,-56.0],[47.5,-59.5],[50.0,-58.5]] },
  { name:"Kanadischer Schild", koord:[58.0,-100.0], poly:[[67.0,-115.0],[64.0,-95.0],[60.0,-78.0],[55.0,-78.5],[51.5,-79.5],[50.0,-95.0],[56.0,-110.0],[62.0,-125.0],[67.0,-125.0]] },
  { name:"Hochland von Mexiko", koord:[20.5,-101.0], poly:[[25.5,-105.0],[24.0,-99.5],[19.5,-98.0],[18.0,-100.5],[19.5,-103.5],[22.5,-105.5]] },
];

// ================= B) GEWÄSSER =================
const GEWAESSER = [
  { name:"Mississippi", path:[[47.2,-95.2],[43.5,-91.3],[41.4,-90.4],[38.6,-90.2],[35.1,-90.1],[32.3,-90.9],[29.2,-89.6]] },
  { name:"Missouri", path:[[45.9,-111.5],[48.0,-104.5],[46.9,-100.5],[44.4,-99.0],[41.8,-96.1],[38.8,-90.2]] },
  { name:"Ohio", path:[[40.7,-80.0],[39.1,-81.5],[38.7,-83.0],[38.3,-86.2],[37.0,-88.6]] },
  { name:"Rio Grande", path:[[37.8,-107.5],[36.7,-106.3],[34.6,-106.6],[31.8,-107.4],[29.5,-101.4],[26.1,-98.1]] },
  { name:"Colorado", path:[[40.5,-105.8],[39.1,-108.5],[36.9,-111.5],[36.0,-112.0],[34.3,-114.6],[32.7,-114.6]] },
  { name:"Mackenzie", path:[[55.0,-113.5],[58.5,-114.5],[61.5,-114.0],[65.0,-121.5],[67.5,-134.8]] },
  { name:"St.-Lorenz-Strom", path:[[45.5,-73.6],[46.2,-74.9],[47.3,-79.5],[48.5,-81.5]] },
  { name:"Grosser Bärensee", koord:[66.0,-121.0], poly:[[67.0,-126.5],[66.0,-121.5],[65.2,-116.0],[66.5,-116.5],[67.0,-121.0]] },
  { name:"Grosser Sklavensee", koord:[61.5,-114.0], poly:[[62.5,-117.0],[61.5,-113.5],[61.0,-110.5],[62.0,-111.0],[63.0,-115.0]] },
  { name:"Winnipegsee", koord:[52.5,-97.8], poly:[[53.5,-98.5],[52.8,-97.0],[52.2,-96.7],[51.5,-97.5],[52.3,-99.0]] },
  { name:"Oberer See", koord:[47.7,-87.5], poly:[[48.8,-92.1],[47.8,-91.3],[46.5,-89.5],[46.5,-87.0],[47.5,-85.5],[48.8,-88.0]] },
];

// ================= C) MEERESTEILE =================
const MEERE = [
  { name:"Golf von Mexiko", koord:[25.0,-90.0] },
  { name:"Golf von Kalifornien", koord:[28.2,-112.4] },
  { name:"Beringstrasse", koord:[65.8,-169.0] },
  { name:"Hudson Bay", koord:[59.0,-85.0] },
  { name:"Davis Strasse", koord:[65.5,-60.0] },
  { name:"Beaufort-See", koord:[71.5,-135.0] },
  { name:"Golf von Alaska", koord:[57.0,-145.0] },
  { name:"Pazifischer Ozean", koord:[15.0,-135.0] },
  { name:"Atlantischer Ozean", koord:[25.0,-55.0] },
];

// ================= D) GEBIRGE =================
const GEBIRGE = [
  { name:"Rocky Mountains", koord:[43.0,-110.0], poly:[[49.0,-114.0],[49.0,-106.0],[43.0,-105.5],[39.0,-106.5],[35.0,-107.5],[35.0,-111.0],[40.0,-113.0],[46.0,-114.5]] },
  { name:"Appalachen", koord:[39.5,-79.0], poly:[[34.8,-84.5],[36.5,-82.5],[39.0,-79.0],[42.0,-74.5],[44.5,-71.0],[46.0,-69.5],[45.5,-72.5],[42.5,-76.0],[39.5,-80.5],[36.0,-83.5]] },
  { name:"Sierra Madre Occidental", koord:[25.0,-106.5], poly:[[30.5,-108.5],[26.5,-106.0],[22.5,-105.0],[21.5,-104.5],[23.5,-106.5],[27.5,-108.5]] },
  { name:"Sierra Madre Oriental", koord:[23.5,-99.5], poly:[[27.5,-100.5],[25.5,-99.0],[21.5,-98.0],[19.5,-97.5],[20.5,-99.5],[24.0,-101.0]] },
  { name:"Küstenkette", koord:[46.5,-121.8], poly:[[49.5,-123.5],[46.0,-121.5],[41.5,-122.5],[40.5,-120.5],[44.0,-120.5],[48.5,-123.5]] },
  { name:"Sierra Nevada", koord:[37.5,-119.0], poly:[[40.0,-120.8],[39.0,-119.8],[37.0,-119.0],[35.5,-118.5],[35.7,-120.5],[38.5,-121.0]] },
  { name:"Brookskette", koord:[69.0,-152.0], poly:[[71.0,-157.0],[69.0,-152.5],[67.5,-146.5],[68.5,-144.0],[70.0,-149.5]] },
];

// ================= E) STÄDTE =================
const STAEDTE = [
  { name:"New York", koord:[40.71,-74.01] },
  { name:"Boston", koord:[42.36,-71.06] },
  { name:"Montreal", koord:[45.50,-73.57] },
  { name:"Ottawa", koord:[45.42,-75.70] },
  { name:"Toronto", koord:[43.65,-79.38] },
  { name:"Detroit", koord:[42.33,-83.05] },
  { name:"Chicago", koord:[41.88,-87.63] },
  { name:"St. Louis", koord:[38.63,-90.20] },
  { name:"Memphis", koord:[35.15,-90.05] },
  { name:"New Orleans", koord:[29.95,-90.07] },
  { name:"Atlanta", koord:[33.75,-84.39] },
  { name:"San Diego", koord:[32.72,-117.16] },
  { name:"Los Angeles", koord:[34.05,-118.24] },
  { name:"Las Vegas", koord:[36.17,-115.14] },
  { name:"Salt Lake City", koord:[40.76,-111.89] },
  { name:"San Francisco", koord:[37.77,-122.42] },
  { name:"Seattle", koord:[47.61,-122.33] },
  { name:"Vancouver", koord:[49.28,-123.12] },
  { name:"Anchorage", koord:[61.22,-149.90] },
];

// ================= KARTE =================
const map = L.map('map', {
  minZoom: 2,
  zoomSnap: 0.25,            // feinere Zoomstufen statt ganzer Stufen
  zoomDelta: 0.5,             // +/− Buttons zoomen halbe Stufen
  wheelPxPerZoomLevel: 90,    // sanfteres Mausrad-Zoom
  wheelDebounceTime: 40,      // fluessigeres Reagieren
  tapTolerance: 15,          // Tipp vs. Ziehen besser unterscheiden
  touchZoom: "center",       // Pinch-Zoom haelt Kartenmitte fest
  tapHold: false
}).setView([48, -105], 3);
map.zoomControl.setPosition("topright");
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

const layers = { A: [], B: [], C: [], D: [], E: [] };
const COLORS = { A:"#e65100", B:"#1e88e5", C:"#00838f", D:"#7b1fa2", E:"#c62828" };
let labelsOn = false;

function addLabel(obj, text, color) {
  obj.bindTooltip(text, { permanent: true, direction: "center", className: "term-label" });
  obj.labelColor = color;
}

// A) Großräume
GROSSRAEUME.forEach(g => {
  let obj;
  const popup = `<div class="popup-title">🌍 ${g.name}</div><div class="popup-info">${g.info || "Großraum / Naturregion"}</div>`;
  if (g.poly) {
    obj = L.polygon(g.poly, { color: COLORS.A, weight: 1.5, fillColor: COLORS.A, fillOpacity: .18 }).bindPopup(popup);
  } else {
    obj = L.circleMarker(g.koord, { radius: 9, color: COLORS.A, weight: 2, fillColor: COLORS.A, fillOpacity: .35 }).bindPopup(popup);
  }
  addLabel(obj, g.name, COLORS.A);
  obj.quizPoint = g.koord;
  layers.A.push(obj); obj.addTo(map);
});

// B) Gewässer
GEWAESSER.forEach(g => {
  let obj;
  if (g.path) {
    const mid = g.path[Math.floor(g.path.length / 2)];
    obj = L.polyline(g.path, { color: COLORS.B, weight: 4, opacity: .8 })
      .bindPopup(`<div class="popup-title">🌊 ${g.name}</div><div class="popup-info">Fluss</div>`);
    obj.quizPoint = mid;
  } else {
    obj = L.polygon(g.poly, { color: COLORS.B, weight: 1.5, fillColor: COLORS.B, fillOpacity: .3 })
      .bindPopup(`<div class="popup-title">💧 ${g.name}</div><div class="popup-info">See</div>`);
    obj.quizPoint = g.koord;
  }
  addLabel(obj, g.name, COLORS.B);
  layers.B.push(obj); obj.addTo(map);
});

// C) Meeresteile
MEERE.forEach(m => {
  const obj = L.marker(m.koord, {
    icon: L.divIcon({
      className: "",
      html: `<div style="color:${COLORS.C};font-weight:700;font-size:.85rem;text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff;white-space:nowrap">${m.name}</div>`,
      iconSize: null, iconAnchor: [0, 8]
    })
  }).bindPopup(`<div class="popup-title">🌊 ${m.name}</div><div class="popup-info">Meeresteil</div>`);
  obj.quizPoint = m.koord;
  obj.isSeaLabel = true;
  layers.C.push(obj); obj.addTo(map);
});

// D) Gebirge
GEBIRGE.forEach(g => {
  const obj = L.polygon(g.poly, { color: COLORS.D, weight: 1.5, fillColor: COLORS.D, fillOpacity: .2 })
    .bindPopup(`<div class="popup-title">⛰️ ${g.name}</div><div class="popup-info">Gebirge</div>`);
  addLabel(obj, g.name, COLORS.D);
  obj.quizPoint = g.koord;
  layers.D.push(obj); obj.addTo(map);
});

// E) Städte
const cityIcon = L.divIcon({
  className: "",
  html: `<div style="width:12px;height:12px;background:${COLORS.E};border:2px solid white;border-radius:50%;box-shadow:0 0 4px rgba(0,0,0,.5)"></div>`,
  iconSize: [12,12], iconAnchor: [6,6]
});
STAEDTE.forEach(s => {
  const m = L.marker(s.koord, { icon: cityIcon })
    .bindPopup(`<div class="popup-title">🏙️ ${s.name}</div><div class="popup-info">Stadt</div>`);
  addLabel(m, s.name, COLORS.E);
  m.quizPoint = s.koord;
  layers.E.push(m); m.addTo(map);
});

// Legende
const legend = L.control({ position: "bottomleft" });
legend.onAdd = () => {
  const d = L.DomUtil.create("div", "legend");
  d.innerHTML = `
    <span class="dot" style="background:${COLORS.A}"></span>A) Großräume<br>
    <span class="dot" style="background:${COLORS.B}"></span>B) Gewässer<br>
    <span class="dot" style="background:${COLORS.C}"></span>C) Meeresteile<br>
    <span class="dot" style="background:${COLORS.D}"></span>D) Gebirge<br>
    <span class="dot" style="background:${COLORS.E}"></span>E) Städte`;
  return d;
};
legend.addTo(map);

// ================= LAYER-FILTER & LABELS =================
function toggleLayer(key) {
  const btn = document.getElementById("btn-" + key);
  btn.classList.toggle("active");
  const on = btn.classList.contains("active");
  layers[key].forEach(o => {
    if (!on) { map.removeLayer(o); return; }
    if (o.isSeaLabel && (!labelsOn || quizActive)) return;  // Meer-Namen nur wenn Namen an
    o.addTo(map);
    if (!labelsOn || quizActive) o.closeTooltip();
  });
}

function setLabels(on) {
  Object.values(layers).flat().forEach(o => {
    if (o.isSeaLabel) {
      if (on && catActive("C")) o.addTo(map);
      else map.removeLayer(o);
    } else {
      if (!map.hasLayer(o)) return;
      if (on) o.openTooltip(); else o.closeTooltip();
    }
  });
}

function toggleLabels() {
  const btn = document.getElementById("btn-labels");
  btn.classList.toggle("active");
  labelsOn = btn.classList.contains("active");
  if (!quizActive) setLabels(labelsOn);
}

// ================= QUIZ =================
let quizActive = false, current = null, locked = false, answerMarker = null;
const score = { good: 0, ok: 0, bad: 0, total: 0 };

// Layer klick-durchlaessig schalten (ohne Overlay, damit Ziehen/Zoomen normal funktioniert)
function setLayersInteractive(on) {
  Object.values(layers).flat().forEach(o => {
    if (o.options.interactive === on) return;
    o.options.interactive = on;
    if (map.hasLayer(o)) {
      map.removeLayer(o);
      o.addTo(map);
      if (!on || (!labelsOn && !quizActive)) o.closeTooltip();
    }
  });
}

function catActive(key) {
  return document.getElementById("btn-" + key).classList.contains("active");
}

function pointInPoly(lat, lng, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const yi = ring[i][0], xi = ring[i][1], yj = ring[j][0], xj = ring[j][1];
    if (((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

function quizPool() {
  const pool = [];
  if (catActive("A")) GROSSRAEUME.forEach(g => pool.push({ name: g.name, koord: g.koord, art: "der Großraum", poly: g.poly }));
  if (catActive("B")) GEWAESSER.forEach(g => pool.push({ name: g.name, koord: g.path ? g.path[Math.floor(g.path.length/2)] : g.koord, art: g.path ? "der Fluss" : "der See", poly: g.poly, path: g.path }));
  if (catActive("C")) MEERE.forEach(m => pool.push({ name: m.name, koord: m.koord, art: "der Meeresteil" }));
  if (catActive("D")) GEBIRGE.forEach(g => pool.push({ name: g.name, koord: g.koord, art: "das Gebirge", poly: g.poly }));
  if (catActive("E")) STAEDTE.forEach(s => pool.push({ name: s.name, koord: s.koord, art: "die Stadt" }));
  return pool;
}

function toggleQuiz() {
  quizActive = !quizActive;
  document.getElementById("btn-quiz").classList.toggle("active", quizActive);
  document.getElementById("btn-quiz").textContent = quizActive ? "⏹️ Quiz beenden" : "🎯 Quiz";
  document.getElementById("quiz-banner").style.display = quizActive ? "block" : "none";
  document.getElementById("score-panel").style.display = quizActive ? "block" : "none";
  if (quizActive) {
    if (drawActive) toggleDraw();
    setLayersInteractive(false);
    setLabels(false);
    nextQuestion();
  } else {
    if (answerMarker) { map.removeLayer(answerMarker); answerMarker = null; }
    setLayersInteractive(true);
    setLabels(labelsOn);
    document.getElementById("quiz-result").textContent = "";
    current = null;
  }
}

function nextQuestion() {
  const pool = quizPool();
  if (answerMarker) { map.removeLayer(answerMarker); answerMarker = null; }
  if (!pool.length) {
    current = null;
    document.getElementById("quiz-question").textContent = "⚠️ Keine Kategorie aktiv – bitte oben mind. eine (A–E) aktivieren!";
    document.getElementById("quiz-result").textContent = "";
    document.getElementById("quiz-score").textContent = "";
    return;
  }
  current = pool[Math.floor(Math.random() * pool.length)];
  locked = false;
  setLabels(false);
  document.getElementById("quiz-question").textContent = `Wo liegt ${current.art} „${current.name}“? Klicke auf die Karte!`;
  document.getElementById("quiz-result").textContent = "";
  document.getElementById("quiz-score").textContent = `Frage ${score.total + 1} · ${score.good + score.ok + score.bad} beantwortet`;
}

function handleAnswer(latlng) {
  if (!quizActive || locked || !current) return;
  locked = true;
  const res = document.getElementById("quiz-result");
  let cls, msg, dist;
  if (current.poly && pointInPoly(latlng.lat, latlng.lng, current.poly)) {
    dist = 0;
    cls = "good"; msg = `✅ Richtig! Das war ${current.name} – genau im Gebiet.`; score.good++;
  } else if (current.path) {
    const minDist = Math.min(...current.path.map(p => map.distance(latlng, L.latLng(p)))) / 1000;
    dist = minDist;
    if (minDist < 120) { cls = "good"; msg = `✅ Richtig! Du hast ${current.name} getroffen.`; score.good++; }
    else if (minDist < 300) { cls = "ok"; msg = `🙂 Knapp! ${Math.round(minDist)} km von ${current.name} entfernt.`; score.ok++; }
    else { cls = "bad"; msg = `❌ Weit daneben (${Math.round(minDist)} km). ${current.name} liegt hier:`; score.bad++; }
  } else {
    dist = map.distance(latlng, L.latLng(current.koord)) / 1000;
    if (dist < 80) { cls = "good"; msg = `✅ Richtig! Nur ${Math.round(dist)} km von ${current.name} entfernt.`; score.good++; }
    else if (dist < 300) { cls = "ok"; msg = `🙂 Knapp! ${Math.round(dist)} km von ${current.name} entfernt.`; score.ok++; }
    else { cls = "bad"; msg = `❌ Weit daneben (${Math.round(dist)} km). ${current.name} liegt hier:`; score.bad++; }
  }
  res.className = "result " + cls;
  res.textContent = msg;
  score.total++;
  document.getElementById("sc-good").textContent = score.good;
  document.getElementById("sc-ok").textContent = score.ok;
  document.getElementById("sc-bad").textContent = score.bad;
  document.getElementById("quiz-score").textContent = "Nächste Frage in 3 Sekunden...";

  map.flyTo(current.koord, 4, { duration: 1.2 });
  answerMarker = L.circleMarker(current.koord, { radius: 10, color: "#000", fillColor: "#ffd600", fillOpacity: 1 })
    .addTo(map).bindTooltip(current.name, { permanent: true, direction: "top", className: "term-label" })
    .openTooltip();
  setTimeout(() => { if (quizActive) nextQuestion(); }, 3200);
}

map.on("click", e => {
  if (drawActive) { if (drawPhase === "result") nextDrawTerm(); return; }
  handleAnswer(e.latlng);
});

// ================= ZEICHNEN-MODUS =================
let drawActive = false, drawPhase = "idle", drawing = false, drawPts = [];
let drawLine = null, userPoly = null, solPoly = null;

function drawPool() {
  const pool = [];
  if (catActive("A")) GROSSRAEUME.filter(g => g.poly).forEach(g => pool.push({ name: g.name, art: "den Großraum", ring: g.poly }));
  if (catActive("B")) GEWAESSER.filter(g => g.poly).forEach(g => pool.push({ name: g.name, art: "den See", ring: g.poly }));
  if (catActive("D")) GEBIRGE.forEach(g => pool.push({ name: g.name, art: "das Gebirge", ring: g.poly }));
  return pool;
}

function toggleDraw() {
  drawActive = !drawActive;
  document.getElementById("btn-draw").classList.toggle("active", drawActive);
  document.getElementById("btn-draw").textContent = drawActive ? "⏹️ Zeichnen beenden" : "✏️ Zeichnen";
  document.getElementById("quiz-banner").style.display = drawActive ? "block" : "none";
  if (drawActive) {
    if (quizActive) toggleQuiz();
    setLayersInteractive(false);
    Object.values(layers).flat().forEach(o => map.removeLayer(o));
    map.dragging.disable();
    nextDrawTerm();
  } else {
    clearDrawLayers();
    map.dragging.enable();
    document.getElementById("quiz-banner").style.display = "none";
    setLayersInteractive(true);
    ["A","B","C","D","E"].forEach(k => {
      if (catActive(k)) layers[k].forEach(o => {
        if (o.isSeaLabel && !labelsOn) return;
        o.addTo(map);
        if (!labelsOn) o.closeTooltip();
      });
    });
    drawPhase = "idle";
  }
}

function clearDrawLayers() {
  [drawLine, userPoly, solPoly].forEach(l => { if (l) map.removeLayer(l); });
  drawLine = userPoly = solPoly = null;
}

function nextDrawTerm() {
  clearDrawLayers();
  const pool = drawPool();
  drawPhase = "draw";
  if (!pool.length) {
    document.getElementById("quiz-question").textContent = "⚠️ Keine zeichnenbare Kategorie aktiv (A, B-Seen oder D)!";
    document.getElementById("quiz-result").textContent = "";
    return;
  }
  const t = pool[Math.floor(Math.random() * pool.length)];
  currentDraw = t;
  document.getElementById("quiz-question").textContent = `✏️ Zeichne ${t.art} „${t.name}“ – mit gedrückter Maus/Finger flächig malen!`;
  document.getElementById("quiz-result").textContent = "";
  document.getElementById("quiz-score").textContent = "Bei Fertigstellung loslassen – Klick danach = nächste Aufgabe";
}
let currentDraw = null;

function drawStart(latlng) {
  if (!drawActive || drawPhase !== "draw") return;
  drawing = true;
  drawPts = [latlng];
  if (drawLine) map.removeLayer(drawLine);
  drawLine = L.polyline(drawPts, { color: "#e53935", weight: 3, dashArray: "6 6" }).addTo(map);
}

function drawMove(latlng) {
  if (!drawing || !drawLine) return;
  const last = drawPts[drawPts.length - 1];
  if (last && map.distance(last, latlng) < 30000) return; // min. ~30 km Abstand
  drawPts.push(latlng);
  drawLine.setLatLngs(drawPts);
}

function drawEnd() {
  if (!drawing) return;
  drawing = false;
  suppressNextUntil = Date.now() + 500;
  if (drawPts.length < 3) { drawPts = []; if (drawLine) map.removeLayer(drawLine); drawLine = null; return; }
  drawPhase = "result";
  const ring = drawPts.map(p => [p.lat, p.lng]);
  userPoly = L.polygon(ring, { color: "#e53935", weight: 2, fillOpacity: .25 }).addTo(map);
  evaluateDraw(ring, currentDraw);
}

function evaluateDraw(userRing, t) {
  const sol = t.ring;
  let minLat = 90, maxLat = -90, minLng = 180, maxLng = -180;
  userRing.concat(sol).forEach(p => {
    minLat = Math.min(minLat, p[0]); maxLat = Math.max(maxLat, p[0]);
    minLng = Math.min(minLng, p[1]); maxLng = Math.max(maxLng, p[1]);
  });
  const N = 60;
  let inter = 0, union = 0;
  for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) {
    const lat = minLat + (maxLat - minLat) * i / N;
    const lng = minLng + (maxLng - minLng) * j / N;
    const inUser = pointInPoly(lat, lng, userRing), inSol = pointInPoly(lat, lng, sol);
    if (inUser || inSol) union++;
    if (inUser && inSol) inter++;
  }
  const pct = union ? Math.round(inter / union * 100) : 0;
  const res = document.getElementById("quiz-result");
  let cls, msg;
  if (pct >= 60) { cls = "good"; msg = `🏆 ${pct}% Übereinstimmung – stark! Das ist ${t.name}.`; }
  else if (pct >= 35) { cls = "ok"; msg = `✅ ${pct}% Übereinstimmung – gut getroffen!`; }
  else if (pct >= 18) { cls = "ok"; msg = `🙂 ${pct}% – richtige Richtung, aber noch zu klein/fals platziert.`; }
  else { cls = "bad"; msg = `❓ ${pct}% – schau dir die grüne Fläche an: So liegt ${t.name}.`; }
  res.className = "result " + cls;
  res.textContent = msg;
  document.getElementById("quiz-score").textContent = "Klick auf die Karte = nächste Aufgabe";

  solPoly = L.polygon(sol, { color: "#2e7d32", weight: 3, fillOpacity: .25 }).addTo(map);
  const el = solPoly.getElement();
  if (el) el.classList.add("blink");
  map.fitBounds(L.latLngBounds(sol).pad(0.3), { animate: true });
}

// Maus-Zeichnen
map.on("mousedown", e => drawStart(e.latlng));
map.on("mousemove", e => drawMove(e.latlng));
map.on("mouseup", drawEnd);
// Touch-Zeichnen
const mapContainer = map.getContainer();
mapContainer.addEventListener("touchstart", e => {
  if (!drawActive) return;
  e.preventDefault();
  const rect = mapContainer.getBoundingClientRect();
  const t = e.touches[0];
  drawStart(map.containerPointToLatLng(L.point(t.clientX - rect.left, t.clientY - rect.top)));
}, { passive: false });
mapContainer.addEventListener("touchmove", e => {
  if (!drawActive) return;
  e.preventDefault();
  const rect = mapContainer.getBoundingClientRect();
  const t = e.touches[0];
  drawMove(map.containerPointToLatLng(L.point(t.clientX - rect.left, t.clientY - rect.top)));
}, { passive: false });
mapContainer.addEventListener("touchend", e => { if (drawActive) drawEnd(); });

// ================= SUCHE =================
const CAT_NAMES = { A:"Großraum", B:"Gewässer", C:"Meeresteil", D:"Gebirge", E:"Stadt" };
const searchIndex = [];
GROSSRAEUME.forEach((g,i) => searchIndex.push({ name: g.name, cat: "A", koord: g.koord, obj: layers.A[i] }));
GEWAESSER.forEach((g,i) => searchIndex.push({ name: g.name, cat: "B", koord: g.path ? g.path[Math.floor(g.path.length/2)] : g.koord, obj: layers.B[i] }));
MEERE.forEach((m,i) => searchIndex.push({ name: m.name, cat: "C", koord: m.koord, obj: layers.C[i] }));
GEBIRGE.forEach((g,i) => searchIndex.push({ name: g.name, cat: "D", koord: g.koord, obj: layers.D[i] }));
STAEDTE.forEach((s,i) => searchIndex.push({ name: s.name, cat: "E", koord: s.koord, obj: layers.E[i] }));
let searchMatches = [], searchHL = null;

function doSearch(q) {
  const box = document.getElementById("search-results");
  q = q.trim().toLowerCase();
  if (q.length < 2) { box.style.display = "none"; searchMatches = []; return; }
  searchMatches = searchIndex.filter(t => t.name.toLowerCase().includes(q)).slice(0, 12);
  box.innerHTML = searchMatches.length
    ? searchMatches.map((t,i) => `<div class="item" onclick="searchSelect(${i})"><span class="cat" style="background:${COLORS[t.cat]}"></span>${t.name}<span class="small">${CAT_NAMES[t.cat]}</span></div>`).join("")
    : `<div class="item" style="color:#888">Kein Treffer</div>`;
  box.style.display = "block";
}

function searchSelect(i) {
  const t = searchMatches[i]; if (!t) return;
  document.getElementById("search-results").style.display = "none";
  document.getElementById("search-box").value = t.name;
  if (quizActive) toggleQuiz();
  if (t.obj.isSeaLabel) t.obj.addTo(map); else t.obj.openTooltip();
  if (searchHL) map.removeLayer(searchHL);
  searchHL = L.circleMarker(t.koord, { radius: 10, color: "#000", fillColor: "#ffd600", fillOpacity: 1 })
    .addTo(map).bindTooltip(t.name, { permanent: true, direction: "top", className: "term-label" }).openTooltip();
  map.flyTo(t.koord, 5, { duration: 1 });
  setTimeout(() => {
    if (searchHL) { map.removeLayer(searchHL); searchHL = null; }
    if (!labelsOn && !quizActive) { if (t.obj.isSeaLabel) map.removeLayer(t.obj); else t.obj.closeTooltip(); }
  }, 4000);
}

document.addEventListener("click", e => {
  if (!document.getElementById("search-wrap").contains(e.target)) {
    document.getElementById("search-results").style.display = "none";
  }
});

// Beim Start: Namen ausblenden – nur Flächen und Punkte zeigen
setLabels(false);
</script>
